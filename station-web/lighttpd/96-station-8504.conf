# Ground Station: home page at "/" and tar1090 at "/map/" on port 8504.
# Installed by ground-station/station-web/install.sh.
#
# tar1090's updater rewrites 95-tar1090-otherport.conf, which maps "/" to the
# map. lighttpd merges blocks with the same condition, so this file can't just
# add to 95's 8504 block. Instead it nests an always-true condition inside the
# 8504 block and sets alias.url and url.redirect there with "=". lighttpd
# applies the last matching condition, so these full lists win over 95's, and
# a tar1090 update doesn't undo the home page.
#
# Because these lists replace the global ones on 8504, they repeat the global
# entries from 88-tar1090.conf, 88-graphs1090.conf and 90-javascript-alias.conf.
$SERVER["socket"] == ":8504" {

$HTTP["url"] =~ "^/" {
    url.redirect = (
        "^/map$" => "/map/",
        "^/\?(.*)$" => "/map/?$1",
        "^/index\.html\?(.*)$" => "/map/?$1",
        "^/tar1090$" => "/tar1090/",
        "^/graphs1090/graphs.html$" => "/graphs1090/",
        "^/graphs1090$" => "/graphs1090/",
        "^/graph1090$" => "/graphs1090/",
        "^/graph1090/$" => "/graphs1090/",
        "^/perf$" => "/graphs1090/",
        "^/perf/$" => "/graphs1090/"
    )

    alias.url = (
        "/javascript" => "/usr/share/javascript",
        "/graphs1090/graphs/" => "/run/graphs1090/",
        "/graphs1090/" => "/usr/share/graphs1090/html/",
        "/tar1090/data/" => "/run/readsb/",
        "/tar1090/chunks/" => "/run/tar1090/",
        "/tar1090/globe_history/" => "/var/globe_history/",
        "/tar1090/aircraft_sil/" => "/usr/local/share/tar1090/aircraft_sil/",
        "/tar1090/osm_tiles_offline/" => "/usr/local/share/osm_tiles_offline/",
        "/tar1090/openfreemap_offline/" => "/usr/local/share/openfreemap_offline/mnt/",
        "/tar1090/" => "/usr/local/share/tar1090/html/",
        "/map/data/" => "/run/readsb/",
        "/map/chunks/" => "/run/tar1090/",
        "/map/globe_history/" => "/var/globe_history/",
        "/map/aircraft_sil/" => "/usr/local/share/tar1090/aircraft_sil/",
        "/map/osm_tiles_offline/" => "/usr/local/share/osm_tiles_offline/",
        "/map/openfreemap_offline/" => "/usr/local/share/openfreemap_offline/mnt/",
        "/map/" => "/usr/local/share/tar1090/html/",
        "/station-data/" => "/run/station-web/",
        "/data/" => "/run/readsb/",
        "/" => "/usr/local/share/station-web/html/"
    )
}

$HTTP["url"] =~ "^/(index\.html)?$" {
    setenv.add-response-header += ( "Cache-Control" => "no-cache" )
}
$HTTP["url"] =~ "^/station-data/" {
    setenv.add-response-header += ( "Cache-Control" => "no-cache" )
}

# tar1090 headers, same as 88-tar1090.conf with /tar1090/ -> /map/
$HTTP["url"] =~ "^/map/data/.*\.binCraft$" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/data/.*\.zst$" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        )
}
$HTTP["url"] =~ "^/map/chunks/chunk_.*gz$" {
    setenv.add-response-header += (
        "Access-Control-Allow-Origin" => "*",
        "Cache-Control" => "public, max-age=1209600",
        "Content-Encoding" => "gzip",
        "Content-Type" => "application/json",
        )
}
$HTTP["url"] =~ "^/map/chunks/current_.*gz$" {
    setenv.add-response-header += (
        "Access-Control-Allow-Origin" => "*",
        "Cache-Control" => "no-cache",
        "Content-Encoding" => "gzip",
        "Content-Type" => "application/json",
        )
}
$HTTP["url"] =~ "^/map/chunks/978\.json$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        )
}
$HTTP["url"] =~ "^/map/data/aircraft\.json$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        )
}
$HTTP["url"] =~ "^/map/data/globe.*json$" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/data/traces/" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/globe_history/" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=3600",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/images" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}
$HTTP["url"] =~ "^/map/flags" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}
$HTTP["url"] =~ "^/map/aircraft_sil" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}

$HTTP["url"] =~ "^/map/config.js$" {
    setenv.add-response-header += (
        "Cache-Control" => "no-cache",
        )
}
$HTTP["url"] =~ "^/map/(?!config)[^/]*\.js$" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}
$HTTP["url"] =~ "^/map/db-.*\.js$" {
#    deflate.mimetypes = ()
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/libs/.*$" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}
$HTTP["url"] =~ "^/map/openfreemap_offline/tiles" {
    setenv.add-response-header += (
        "Content-Encoding" => "gzip",
        )
}
$HTTP["url"] =~ "^/map/style.css$" {
    setenv.add-response-header += (
        "Cache-Control" => "public, max-age=1209600",
        )
}
}
