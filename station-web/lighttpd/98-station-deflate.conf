# Ground Station: compress the big static files (map library, jquery-ui,
# tar1090 script, css, html) so the public map loads faster over Funnel.
# Compressed copies are cached on disk, so the Pi 3 compresses each file once.
# Files tar1090 already serves gzipped (db shards) are left alone.
# Undo: sudo rm /etc/lighttpd/conf-enabled/98-station-deflate.conf && sudo systemctl reload lighttpd
server.modules += ( "mod_deflate" )
deflate.allowed-encodings = ( "gzip" )
deflate.cache-dir = "/var/cache/lighttpd/compress"
deflate.mimetypes = (
    "text/html", "text/css", "text/plain",
    "application/javascript", "text/javascript",
    "application/json", "image/svg+xml"
)
deflate.min-compress-size = 1024
