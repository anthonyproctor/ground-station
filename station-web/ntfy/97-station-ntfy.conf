# Ground Station: ntfy for Anthony's phone. Only ntfy API paths and gs- topics on :8504
# go to the localhost ntfy server (deny-all auth). Approved by Anthony 2026-10-12.
server.modules += ( "mod_proxy" )
$SERVER["socket"] == ":8504" {
  $HTTP["url"] =~ "^/(v1/|gs-[A-Za-z0-9_-]{20,}(/|$))" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 2586 ) ) )
    proxy.header = ( "upgrade" => "enable" )
    server.stream-response-body = 2
  }
}
