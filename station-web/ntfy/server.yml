# ntfy server for the Ground Station alerts.
# Installed to /etc/ntfy/server.yml by station-web/ntfy/setup-ntfy.sh, which
# appends base-url (the public station root) and upstream-base-url
# (https://ntfy.sh, iOS wake-ups) on the Pi only, keeping the host out of git.
#
# Listens on 127.0.0.1; the phone reaches it through lighttpd
# (97-station-ntfy.conf proxies only /v1/ and gs-* topics).

listen-http: "127.0.0.1:2586"

# Messages are kept 24 h so a phone can fetch them later.
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "24h"

# Nobody reads or writes anything without an account.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
enable-signup: false
enable-login: false
enable-reservations: false

# No web app, no attachments, no email.
web-root: disable

log-level: info
log-level-overrides:
  - "tag=publish -> debug"
